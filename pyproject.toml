[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-recall"
version = "0.1.0"
description = "RAG assistant over a GitHub project's docs and issues"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"repo_recall.evaluation" = ["prompts/*.md"]
