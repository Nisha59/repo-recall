# The whole app: Postgres with pgvector (the search index) and the API + UI.
#   docker compose up --build      # start both; UI at http://localhost:8000
#   docker compose up -d db        # just the database (for indexing / running from .venv)
#   docker compose down            # stop (indexed data stays in the pgdata volume)
#   docker compose down -v         # stop and delete all indexed data
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: repo_recall
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d repo_recall"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    # LLM settings and API keys come from .env; the database address is
    # overridden because inside compose Postgres is the `db` service, not localhost.
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_DSN: postgresql://postgres:postgres@db:5432/repo_recall
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
